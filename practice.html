<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practicing Html</title>
    <style>
        #para{
            background-color: yellow;
        }  
        .info{
            text-align: center;
        }      
    </style>
</head>
<body>
    <p id="para" class="info" title="paragraph">This is paragraph</p>
    <img src="dog.jpg" alt="dog-image is an alternative text" title="dog-image">
    <dl>
        <dt title="description term">HTML:</dt>
        <dd title="description data">It is a markup language</dd>
        <dd title="description data">It is used to define the structure and content of a webpage</dd>
    </dl>

    <b title="bold content">Bold content</b> <br>
    <strong title="important content">Bold content with Importance</strong>

    <form action="">
        <input type="text" name="" id="" readonly>
        <input type="checkbox" disabled>
    </form>

</body>
</html>
