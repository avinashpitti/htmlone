<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <table>
        <caption>Students Marks</caption>
        <colgroup>
            <col class="name-column">
            <col class="marks-column">
        </colgroup>
        <thead>
            <tr>
                <th>Name</th>
                <th>Marks</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Avinash</td>
                <td>84</td>
            </tr>
            <tr>
                <td>Ramesh</td>
                <td>81</td>
            </tr>
            <tr>
                <td>Ajay</td>
                <td>67</td>
            </tr>
            <tr>
                <td >sruthi</td>
                <td rowspan="2">76</td>
            </tr>
            <tr>
                <td>vinay</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
