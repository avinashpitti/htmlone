<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image_Map</title>
</head>
<body>
    <img src="living_room.jpg" alt="Living Room Map" width="290" height="300" usemap="#myMap">

    <map name="myMap">
        <!-- 'rect' requires 4 comma-separated pixel numbers: x1, y1, x2, y2 -->
        <area shape="rect" coords="50,100,180,220" href="table.html" alt="Table in living room" target="_blank">
    </map>
</body>
</html>
