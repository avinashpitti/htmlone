<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html entities,pre</title>
</head>
<body>
    <p>5&lt;10</p>
    <p>100&gt;5</p>
    <!-- &nbsp; adds extra spaces that browsers normally collapse -->
    <p>Hello&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;World!</p>

    <!-- &nbsp; prevents words from breaking across lines -->
    <p>Price:&nbsp;₹1,500</p>
</body>
</html>
